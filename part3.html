  function renderSparklineRow(row) {
    // Draws a tiny inline SVG trend line into a row's .oscore-spark
    // placeholder from its data-overallscore-history attribute (comma-
    // separated Overall Score values, oldest first, written by
    // merge_overall_score.py from score_history.tsv).
    const holder = row.querySelector('.oscore-spark');
    const raw = row.dataset.overallscoreHistory;
    if (!holder || !raw) return;
    const values = raw.split(',').map(Number).filter(v => !isNaN(v));
    if (values.length < 2) return;  // one point alone isn't a trend line yet
    const w = 40, h = 14;
    const min = Math.min(...values), max = Math.max(...values);
    const range = max - min || 1;
    const points = values.map((v, i) => {
      const x = (i / (values.length - 1)) * w;
      const y = h - ((v - min) / range) * h;
      return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    const trendColor = values[values.length - 1] >= values[0] ? 'var(--analysis-high)' : 'var(--analysis-low)';
    holder.innerHTML = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${points}" fill="none" stroke="${trendColor}" stroke-width="1.5"/></svg>`;
  }

  function renderSparklines() {
    // Runs once on load - the history doesn't change with sorting/filtering,
    // only with the next day's scan, so there's no need to re-draw on every
    // applyFilters() call. Spread across idle-time chunks instead of one
    // single loop over 6,761 rows, so it doesn't block the main thread (and
    // the page feels responsive) right after the page finishes loading.
    const CHUNK_SIZE = 300;
    let i = 0;
    function renderChunk() {
      const end = Math.min(i + CHUNK_SIZE, rows.length);
      for (; i < end; i++) renderSparklineRow(rows[i]);
      if (i < rows.length) scheduleNext();
    }
    function scheduleNext() {
      if (window.requestIdleCallback) requestIdleCallback(renderChunk, { timeout: 200 });
      else setTimeout(renderChunk, 0);
    }
    scheduleNext();
  }
  renderSparklines();

  function fmtMoney(v) {
    const n = parseFloat(v);
    if (isNaN(n)) return '–';
    return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  function cap(s) { return s.charAt(0).toUpperCase() + s.slice(1); }
  function pf(row, acct, field) { return row.dataset['pf' + acct.toUpperCase() + cap(field)]; }
  // GBX (London pence) quotes are 1/100 of the account-currency price eToro

  function gbxDivisor(row) { return row.dataset.currency === 'GBX' ? 100 : 1; }

  function buildTpTooltip(row, tpBadge, acct) {
    const tp = parseFloat(pf(row, acct, 'tp'));
    const avg = parseFloat(row.dataset.avg);
    const tpIsSet = !isNaN(tp);

    const STALE_SCAN_DAYS = 3;
    const scandate = row.dataset.scandate;
    let scanAgeDays = null;
    if (scandate) {
      const parsed = new Date(scandate.replace(' ', 'T') + ':00Z');
      if (!isNaN(parsed.getTime())) {
        scanAgeDays = (Date.now() - parsed.getTime()) / 86400000;
      }
    }
    const scanIsStale = scanAgeDays === null || scanAgeDays > STALE_SCAN_DAYS;
    const scanLine = scandate
      ? `Last analyst scan: ${scandate}${scanIsStale ? ' (stale, over ' + STALE_SCAN_DAYS + 'd old)' : ''}`
      : 'Last analyst scan: unknown (stale)';
    const ticker = row.dataset.ticker || '';

    let statusLine, statusCls, canCopy;
    if (!tpIsSet) {
      statusCls = 'tp-unset';
      canCopy = !isNaN(avg) && avg > 0;
      statusLine = canCopy ? 'No TP set yet' : 'No TP set, and no current Avg Target to suggest (No Coverage)';
    } else if (!isNaN(avg) && avg > 0) {
      const diffPct = ((tp - avg) / avg) * 100;
      const withinRange = Math.abs(diffPct) <= 5;
      statusCls = withinRange ? 'tp-current' : (diffPct > 0 ? 'tp-above' : 'tp-below');
      canCopy = !withinRange;
      statusLine = withinRange
        ? `Matches current Avg Target (${fmtMoney(avg)})`
        : `${diffPct > 0 ? 'Above' : 'Below'} current Avg Target (${fmtMoney(avg)}) by ${Math.abs(diffPct).toFixed(1)}%`;
    } else {
      statusCls = 'tp-nodata';
      canCopy = false;
      statusLine = 'No current Avg Target to compare (No Coverage)';
    }
    tpBadge.classList.add(statusCls);
    const tooltip = document.createElement('div');
    tooltip.className = 'pf-tooltip';
    tooltip.innerHTML =
      `<div class="pf-title">Take Profit · ${ticker}</div>` +
      (tpIsSet ? `<div class="pf-row"><div><div class="pf-label">Your TP</div><div class="pf-val-big">${fmtMoney(tp)}</div></div></div>` : '') +
      `<div class="pf-label" style="margin-top:10px;">${statusLine}</div>` +
      `<div class="pf-label" style="margin-top:4px;">${scanLine}</div>` +
      `<div class="pf-tp-actions">` +
      (canCopy
        ? `<button type="button" class="pf-copy-btn" data-copy-value="${avg.toFixed(4)}" data-ticker="${ticker}">Copy ${fmtMoney(avg)} &amp; Open on eToro &rarr;</button>`
        : `<button type="button" class="pf-set-tp-btn" data-ticker="${ticker}">${tpIsSet ? 'View/Edit TP on eToro' : 'Set TP on eToro'} &rarr;</button>`) +
      `</div>`;
    tpBadge.appendChild(tooltip);

    const copyBtn = tooltip.querySelector('.pf-copy-btn');
    if (copyBtn) {
      copyBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const val = copyBtn.dataset.copyValue;
        const tk = copyBtn.dataset.ticker;
        navigator.clipboard.writeText(val).then(() => {
          const original = copyBtn.textContent;
          copyBtn.textContent = 'Copied! Opening...';
          copyBtn.classList.add('copied');
          setTimeout(() => { copyBtn.textContent = original; copyBtn.classList.remove('copied'); }, 1500);
        }).catch(() => {
          copyBtn.textContent = 'Copy failed';
        });
        window.open(`https://www.etoro.com/portfolio/breakdown/${encodeURIComponent(tk)}`, '_blank', 'noopener');
      });
    }
    const setTpBtn = tooltip.querySelector('.pf-set-tp-btn');
    if (setTpBtn) {
      setTpBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        window.open(`https://www.etoro.com/portfolio/breakdown/${encodeURIComponent(setTpBtn.dataset.ticker)}`, '_blank', 'noopener');
      });
    }
  }

  function updateMyPortfolioColumns() {
    let totalInvested = 0, totalPL = 0, totalValue = 0, anyHeld = false;
    let heldCount = 0, noTpCount = 0, pendingCount = 0, pendingInvested = 0;
    rows.forEach(row => {
      const status = pf(row, currentAccount, 'status');
      if (status === 'PENDING') {
        pendingCount++;
        const inv = parseFloat(pf(row, currentAccount, 'netvalue'));
        if (!isNaN(inv)) pendingInvested += inv;
      }
      const unitsCell = row.querySelector('.my-units');
      const avgCell = row.querySelector('.my-avgopen');
      const plCell = row.querySelector('.my-pl');
      const plpctCell = row.querySelector('.my-plpct');
      if (status !== 'HELD') {
        unitsCell.textContent = '–'; unitsCell.classList.add('empty');
        avgCell.textContent = '–'; avgCell.classList.add('empty');
        plCell.textContent = '–'; plCell.classList.add('empty'); plCell.classList.remove('pct-pos','pct-neg');
        plpctCell.textContent = '–'; plpctCell.classList.add('empty'); plpctCell.classList.remove('pct-pos','pct-neg');
        return;
      }
      anyHeld = true;
      heldCount++;
      const tpVal = pf(row, currentAccount, 'tp');
      if (tpVal === undefined || tpVal === '' || isNaN(parseFloat(tpVal))) noTpCount++;
      const units = parseFloat(pf(row, currentAccount, 'units'));
      const avgOpen = parseFloat(pf(row, currentAccount, 'avg')) / gbxDivisor(row);
      const pl = parseFloat(pf(row, currentAccount, 'pl'));
      const plpct = parseFloat(pf(row, currentAccount, 'plpct'));
      const netvalue = parseFloat(pf(row, currentAccount, 'netvalue'));
      unitsCell.textContent = !isNaN(units) ? units.toLocaleString(undefined, {maximumFractionDigits: 4}) : '–';
      unitsCell.classList.remove('empty');
      avgCell.textContent = fmtMoney(avgOpen);
      avgCell.classList.remove('empty');
      plCell.textContent = fmtMoney(pl);
      plCell.classList.remove('empty');
      plCell.classList.toggle('pct-pos', pl >= 0);
      plCell.classList.toggle('pct-neg', pl < 0);
      plpctCell.textContent = !isNaN(plpct) ? (plpct >= 0 ? '+' : '') + plpct.toFixed(2) + '%' : '–';
      plpctCell.classList.remove('empty');
      plpctCell.classList.toggle('pct-pos', plpct >= 0);
      plpctCell.classList.toggle('pct-neg', plpct < 0);
      if (!isNaN(units) && !isNaN(avgOpen)) totalInvested += units * avgOpen;
      if (!isNaN(pl)) totalPL += pl;
      if (!isNaN(netvalue)) totalValue += netvalue;
    });
    if (myPortfolioGroupHeader) {
      myPortfolioGroupHeader.textContent = 'My Portfolio (' + (currentAccount === 'v' ? 'Virtual' : 'Real') + ')';
    }
    if (summaryInvested) {
      if (anyHeld) {
        summaryInvested.textContent = fmtMoney(totalInvested);
        summaryPL.textContent = fmtMoney(totalPL);
        summaryPL.classList.toggle('pct-pos', totalPL >= 0);
        summaryPL.classList.toggle('pct-neg', totalPL < 0);
        summaryValue.textContent = fmtMoney(totalValue);
      } else {
        summaryInvested.textContent = '–';
        summaryPL.textContent = '–';
        summaryValue.textContent = '–';
      }
      summaryHeldCount.textContent = heldCount;
      summaryNoTpCount.textContent = noTpCount;
      if (pendingCount > 0) {
        summaryPendingCount.textContent = pendingCount + ' (' + fmtMoney(pendingInvested) + ')';
        summaryPendingWrap.classList.add('has-pending');
      } else {
        summaryPendingCount.textContent = '0';
        summaryPendingWrap.classList.remove('has-pending');
      }
    }
  }

  const TOOLTIP_HEIGHT_ESTIMATE = 220;
  let tooltipHideTimer = null;

  function positionTooltip(tooltip, badge) {
    const badgeRect = badge.getBoundingClientRect();
    const tw = tooltip.offsetWidth || 260;
    let left = badgeRect.left;
    const maxLeft = window.innerWidth - tw - 8;
    if (left > maxLeft) left = Math.max(8, maxLeft);
    tooltip.style.left = left + 'px';
    const showAbove = badgeRect.bottom + TOOLTIP_HEIGHT_ESTIMATE > window.innerHeight;
    if (showAbove) {
      tooltip.style.bottom = (window.innerHeight - badgeRect.top + 4) + 'px';
      tooltip.style.top = '';
    } else {
      tooltip.style.top = (badgeRect.bottom + 4) + 'px';
      tooltip.style.bottom = '';
    }
  }

  // Reparented to <body> while shown (not just position:fixed) — a table cell with
  // position:sticky (the frozen ticker/row-number columns) establishes its own
  // stacking context, so a fixed-position descendant is still painted as part of
  // that cell's context and loses the paint-order tie-break to later rows' sticky
  // columns (same z-index, later in DOM). Moving the node out to <body> escapes
  // that entirely. CSS :hover no longer drives visibility once reparented (the
  // tooltip stops being a descendant of the badge), so display is JS-managed here,
  // with a short hide delay so moving the pointer from badge to tooltip doesn't
  // close it in the gap between them.
  document.querySelectorAll('.pf-badge, .tp-badge').forEach(badge => {
    const tooltip = badge.querySelector('.pf-tooltip');
    if (!tooltip) return;
    const showTooltip = () => {
      clearTimeout(tooltipHideTimer);
      if (tooltip.parentElement !== document.body) {
        tooltip._homeBadge = badge;
        document.body.appendChild(tooltip);
      }
      positionTooltip(tooltip, badge);
      tooltip.style.display = 'block';
    };
    const scheduleHide = () => {
      clearTimeout(tooltipHideTimer);
      tooltipHideTimer = setTimeout(() => {
        tooltip.style.display = 'none';
        if (tooltip._homeBadge) tooltip._homeBadge.appendChild(tooltip);
      }, 150);
    };
    badge.addEventListener('mouseenter', showTooltip);
    badge.addEventListener('mouseleave', scheduleHide);
    tooltip.addEventListener('mouseenter', () => clearTimeout(tooltipHideTimer));
    tooltip.addEventListener('mouseleave', scheduleHide);
  });

  const accountToggle = document.getElementById('accountToggle');
  if (accountToggle) {
    accountToggle.addEventListener('click', (e) => {
      const btn = e.target.closest('.acct-btn');
      if (!btn) return;
      currentAccount = btn.dataset.acct;
      accountToggle.querySelectorAll('.acct-btn').forEach(b => b.classList.toggle('active', b === btn));
      applyAccountVisibility();
      updateMyPortfolioColumns();
      applyFilters();
    });
  }

  const scanStatusPanel = document.getElementById('scanStatusPanel');
  if (scanStatusPanel) {
    const justFinished = new Set(); // names that were running last poll, to know when to offer a reload
    const wasRunning = {};
    let cloudActiveScan = null; // data-scan key currently being updated by the cloud poller below

    function fmtAgo(unixSec) {
      const s = Date.now() / 1000 - unixSec;
      if (s < 60) return 'just now';
      if (s < 3600) return Math.round(s / 60) + 'm ago';
      if (s < 86400) return Math.round(s / 3600) + 'h ago';
      return Math.round(s / 86400) + 'd ago';
    }

    function renderRow(name, info) {
      const row = scanStatusPanel.querySelector(`[data-scan="${name}"]`);
      if (!row) return;
      const btn = row.querySelector('.scan-status-btn');
      const text = row.querySelector('.scan-status-text');
      row.classList.toggle('is-running', !!info.running);
      if (info.running) {
        btn.disabled = true;
        btn.textContent = 'Running…';
        if (info.total) {
          const pct = Math.round((info.done / info.total) * 100);
          text.textContent = `${info.done}/${info.total} (${pct}%)` + (info.eta_min != null ? `, ETA ${info.eta_min.toFixed(0)}m` : '');
        } else {
          text.textContent = 'running…';
        }
        wasRunning[name] = true;
      } else {
        btn.disabled = false;
        btn.textContent = '↻ Run';
        if (wasRunning[name]) {
          justFinished.add(name);
          wasRunning[name] = false;
        }
        // If the cloud poller (below) is actively updating this same row
        // with live cloud progress, don't stomp on it with the local
        // "last: Xh ago" text every 10s - the cloud poller owns this row's
        // text until its own scan completes.
        if (name === cloudActiveScan) return;
        text.textContent = info.last_completed ? `last: ${fmtAgo(info.last_completed)}` : 'never run';
        // Full local date/time on hover - "4h ago" alone doesn't say
        // whether that's this morning or yesterday night without doing
        // the math yourself.
        text.title = info.last_completed ? new Date(info.last_completed * 1000).toLocaleString() : '';
      }
    }

    async function pollStatus() {
      try {
        const res = await fetch('/status');
        const data = await res.json();
        Object.keys(data).forEach(name => renderRow(name, data[name]));
        if (justFinished.has('scan_values')) {
          justFinished.delete('scan_values');
          location.reload();
        }
      } catch (err) {
        scanStatusPanel.querySelectorAll('.scan-status-text').forEach(t => t.textContent = 'server offline');
      }
    }

    scanStatusPanel.querySelectorAll('[data-run]').forEach(btn => {
      btn.addEventListener('click', async () => {
        const name = btn.dataset.run;
        btn.disabled = true;
        btn.textContent = 'Starting…';
        try {
          await fetch('/run/' + name, { method: 'POST' });
        } catch (err) {
          btn.disabled = false;
          btn.textContent = '↻ Run';
        }
        pollStatus();
      });
    });

    const runAllBackgroundBtn = document.getElementById('runAllBackgroundBtn');
    if (runAllBackgroundBtn) {
      runAllBackgroundBtn.addEventListener('click', async () => {
        runAllBackgroundBtn.disabled = true;
        runAllBackgroundBtn.textContent = 'Starting…';
        const names = ['megascan', 'megascan_yahoo', 'insider_scan', 'fundamentals_scan'];
        try {
          await Promise.all(names.map(n => fetch('/run/' + n, { method: 'POST' })));
        } catch (err) {
          // individual scans that are already running just no-op server-side -
          // a partial failure here still means the others were started fine
        }
        runAllBackgroundBtn.disabled = false;
        runAllBackgroundBtn.textContent = '↻ Run All';
        pollStatus();
      });
    }

    pollStatus();
    setInterval(pollStatus, 10000);

    // Auto-pull on page load: fires once per load instead of only relying on
    // the once-a-day Scheduled Task, so opening the site is enough to pick
    // up whatever the cloud has already scanned. Harmless to fire every
    // time - the server just runs `git pull` (near-instant no-op if nothing
    // new) and no-ops entirely if a pull is already in flight (same
    // already-running guard every other scan button uses). On the public
    // GitHub Pages site there's no local server to answer this at all - the
    // fetch just fails silently, exactly like every other local-only call
    // on this page.
    fetch('/run/pull', { method: 'POST' }).then(() => pollStatus()).catch(() => {});

    // Cloud Scan row: live status of the GitHub Actions workflow that runs
    // MEGASCAN/MEGASCAN YAHOO/INSIDER SCAN/FUNDAMENTALS SCAN daily in the
    // cloud. Uses GitHub's public REST API directly (no auth needed for a
    // public repo) - polled far less often than the local /status (every 5
    // min, not 10s) to stay well under GitHub's 60 req/hr unauthenticated
    // rate limit per visitor.
    const cloudScanText = document.getElementById('cloudScanText');
    const cloudShardDetails = document.getElementById('cloudShardDetails');
    if (cloudScanText) {
      let progressInterval = null;

      // Each shard of the parallel cloud workflow force-pushes its own tiny
      // "Done: X / Y" progress file to its own dedicated branch every ~15s
      // (see daily-scan.yml) - no two shards share a branch, so polling them
      // here is just plain reads from GitHub's raw-content CDN (not the
      // rate-limited API), same as the old single-file CLOUD_PROGRESS.md was.
      const SHARD_BRANCHES = {
        megascan: [0, 1, 2, 3, 4, 5].map(i => `progress-megascan-shard${i}`),
        megascan_yahoo: [0, 1, 2, 3, 4, 5].map(i => `progress-megascan-yahoo-shard${i}`),
        fundamentals_scan: [0, 1, 2].map(i => `progress-fundamentals-shard${i}`),
        insider_scan: ['progress-insider-scan'],
      };

      async function fetchShardProgress(branch) {
        try {
          const res = await fetch(`https://raw.githubusercontent.com/tomerla206/etoro-stock-tracker/${branch}/shard_progress.md?t=${Date.now()}`);
          if (!res.ok) return null;
          const text = await res.text();
          const m = text.match(/Done:\s*(\d+)\s*\/\s*(\d+)/);
          return m ? { done: +m[1], total: +m[2] } : null;
        } catch (err) {
          return null;
        }
      }

      function renderShardGroup(scanKey, branches, results) {
        let group = cloudShardDetails.querySelector(`[data-shard-group="${scanKey}"]`);
        if (!group) {
          group = document.createElement('div');
          group.className = 'cloud-shard-group';
          group.dataset.shardGroup = scanKey;
          cloudShardDetails.appendChild(group);
        }
        const valid = results.filter(r => r);
        const done = valid.reduce((a, r) => a + r.done, 0);
        const total = valid.reduce((a, r) => a + r.total, 0);
        const pct = total ? Math.round((done / total) * 100) : 0;
        const bars = branches.map((b, i) => {
          const r = results[i];
          const barPct = r && r.total ? Math.round((r.done / r.total) * 100) : 0;
          const label = r ? `${r.done}/${r.total}` : (branches.length > 1 ? 'waiting…' : '');
          return branches.length > 1
            ? `<div class="cloud-shard-bar-row">
                 <span class="cloud-shard-label">#${i}</span>
                 <div class="cloud-shard-bar"><div class="cloud-shard-fill" style="width:${barPct}%"></div></div>
                 <span class="cloud-shard-pct">${label}</span>
               </div>`
            : '';
        }).join('');
        group.innerHTML = `<div class="cloud-shard-title">${scanKey}<span class="cloud-shard-total">${done}/${total} (${pct}%)</span></div>${bars}`;
        return { done, total, pct };
      }

      async function pollShardProgress() {
        let anyFound = false;
        for (const [scanKey, branches] of Object.entries(SHARD_BRANCHES)) {
          const results = await Promise.all(branches.map(fetchShardProgress));
          if (!results.some(r => r)) continue;
          anyFound = true;
          const agg = renderShardGroup(scanKey, branches, results);
          const row = scanStatusPanel.querySelector(`[data-scan="${scanKey}"]`);
          const rowText = row && row.querySelector('.scan-status-text');
          if (rowText) rowText.textContent = `☁ ${agg.done}/${agg.total} (${agg.pct}%)`;
          cloudActiveScan = scanKey;
        }
        return anyFound;
      }

      async function pollCloudScan() {
        try {
          const res = await fetch('https://api.github.com/repos/tomerla206/etoro-stock-tracker/actions/workflows/daily-scan.yml/runs?per_page=1');
          if (!res.ok) {
            // e.g. 403 = GitHub API rate-limited this client; don't show
            // "no runs yet", which reads as "the scan never ran".
            cloudScanText.textContent = res.status === 403 ? 'rate-limited' : `error ${res.status}`;
            return;
          }
          const data = await res.json();
          const run = data.workflow_runs && data.workflow_runs[0];
          if (!run) {
            cloudScanText.textContent = 'no runs yet';
            return;
          }
          if (run.status !== 'completed') {
            cloudScanText.textContent = `running… (started ${fmtAgo(new Date(run.created_at).getTime() / 1000)})`;
            if (!progressInterval) {
              pollShardProgress();
              progressInterval = setInterval(pollShardProgress, 15000);
            }
          } else {
            if (progressInterval) {
              clearInterval(progressInterval);
              progressInterval = null;
            }
            cloudActiveScan = null; // let local /status own the individual scan rows' text again
            cloudShardDetails.innerHTML = ''; // clear yesterday's bars once the run is done
            const ago = fmtAgo(new Date(run.updated_at).getTime() / 1000);
            cloudScanText.textContent = `${run.conclusion}, last: ${ago}`;
            cloudScanText.title = new Date(run.updated_at).toLocaleString();
          }
        } catch (err) {
          cloudScanText.textContent = 'unavailable';
        }
      }
      pollCloudScan();
      setInterval(pollCloudScan, 5 * 60 * 1000);
    }
  }

  rows.forEach(row => {
    const scandate = row.dataset.scandate;
    if (!scandate) return;
    const avgCell = row.querySelector('.analysis-avg');
    if (!avgCell) return;
    const span = document.createElement('span');
    span.className = 'scan-date';
    span.textContent = scandate;
    avgCell.appendChild(span);
  });
  function applyCurrencyLabels() {
    function tag(cell, ccy) {
      if (!cell || cell.classList.contains('empty') || cell.querySelector('.ccy-tag') || cell.querySelector('.ccy-prefix')) return;
      if (ccy === 'USD') {
        const span = document.createElement('span');
        span.className = 'ccy-prefix';
        span.textContent = '$';
        cell.insertBefore(span, cell.firstChild);
      } else {
        const span = document.createElement('span');
        span.className = 'ccy-tag';
        span.textContent = ccy;
        cell.appendChild(span);
      }
    }
    rows.forEach(row => {
      const ccy = row.dataset.currency || 'USD';
      tag(row.querySelector('.price'), ccy);
      // the analyst target (Low/Avg/High) can be in a different currency than the
      // price itself, e.g. London-listed names whose TipRanks coverage is USD-based
      // ADR data while the price is still the LSE quote in GBX — see
      // TARGET_CURRENCY_OVERRIDE in add_currency_labels.py
      const targetCcy = row.dataset.targetCurrency || ccy;
      tag(row.querySelector('.analysis-low'), targetCcy);
      tag(row.querySelector('.analysis-avg'), targetCcy);
      tag(row.querySelector('.analysis-high'), targetCcy);
      const yhCcy = row.dataset.yhCurrency || 'USD';
      tag(row.querySelector('.yh-low'), yhCcy);
      tag(row.querySelector('.yh-avg'), yhCcy);
      tag(row.querySelector('.yh-high'), yhCcy);
    });
  }

  const noResults = document.getElementById('noResults');
  const count = document.getElementById('count');
  const total = rows.length;

  let sortKey = 'name';
  let sortDir = 'asc';
  let activeExchange = 'all';
  let portfolioMode = 'all';

  let autoHidYahoo = false;
  portfolioFilters.addEventListener('click', (e) => {
    const btn = e.target.closest('.status-pill');
    if (!btn) return;
    portfolioMode = btn.dataset.portfolio;
    portfolioFilters.querySelectorAll('.status-pill').forEach(b => b.classList.toggle('active', b === btn));
    // Viewing "In Portfolio" only makes the table very wide (TipRanks + Yahoo +
    // My Portfolio columns all at once) — auto-hide the Yahoo section so the
    // portfolio columns are visible without horizontal scrolling. Only do this
    // if the user hasn't already hidden/shown it manually, and restore it when
    // leaving "In Portfolio" (only if we're the ones who hid it).
    const toggleYahoo = document.getElementById('toggleYahoo');
    if (portfolioMode === 'in' && toggleYahoo.checked) {
      toggleYahoo.checked = false;
      stockTable.classList.add('hide-yahoo');
      autoHidYahoo = true;
    } else if (portfolioMode !== 'in' && autoHidYahoo) {
      toggleYahoo.checked = true;
      stockTable.classList.remove('hide-yahoo');
      autoHidYahoo = false;
    }
    applyFilters();
  });

  function matchesPortfolio(row) {
    const status = pf(row, currentAccount, 'status');
    const inPortfolio = status === 'HELD' || status === 'PENDING';
    if (portfolioMode === 'in') return inPortfolio;
    if (portfolioMode === 'out') return !inPortfolio;
    return true;
  }
  const activeStatuses = new Set(['normal']);

  function rowStatus(row) {
    if (row.classList.contains('row-not-tradeable')) return 'not-tradeable';
    if (row.classList.contains('row-elevated-risk')) return 'elevated-risk';
    if (row.classList.contains('row-nofaq')) return 'nofaq';
    return 'normal';
  }

  const activeUpside = new Set(['pos']);
  function rowUpside(row) {
    const p = parseFloat(row.dataset.pct);
    if (isNaN(p)) return 'undefined';
    return p >= 0 ? 'pos' : 'neg';
  }

  upsideFilters.addEventListener('click', (e) => {
    const btn = e.target.closest('.status-pill');
    if (!btn) return;
    const key = btn.dataset.upside;
    if (activeUpside.has(key)) {
      activeUpside.delete(key);
      btn.classList.remove('active');
    } else {
      activeUpside.add(key);
      btn.classList.add('active');
    }
    applyFilters();
  });

  function computeAllocationForSource(source, sel) {
    const positiveOnly = activeUpside.size === 1 && activeUpside.has('pos');
    const amount = parseFloat(allocationAmount.value);
    let sumPct = 0;
    if (positiveOnly && !isNaN(amount) && amount > 0) {
      rows.forEach(row => {
        if (row.style.display === 'none') return;
        const p = computePctFor(row, source);
        if (p !== null && p > 0) sumPct += p;
      });
    }

    let totalPL = 0;
    let eligibleCount = 0;
    const plValues = new Map();
    const cellKey = source === 'yh' ? 'yh' : 'et';
    rows.forEach(row => {
      const allocCell = cellKey === 'yh' ? row._yhAllocCell : row._allocCell;
      const plCell = cellKey === 'yh' ? row._yhPlCell : row._plCell;
      const p = computePctFor(row, source);
      const eligible = positiveOnly && row.style.display !== 'none' && !isNaN(amount) && amount > 0 && sumPct > 0 && p !== null && p > 0;
      if (eligible) eligibleCount++;
      if (!eligible) {
        allocCell.textContent = '–';
        allocCell.classList.add('empty');
        plCell.textContent = '–';
        plCell.classList.add('empty');
        plCell.classList.remove('pct-pos', 'pct-neg');
        row.dataset[sel.allocKey] = '';
        row.dataset[sel.plKey] = '';
      } else {
        const share = (p / sumPct) * amount;
        allocCell.textContent = '$' + share.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        allocCell.classList.remove('empty');
        const pl = share * (p / 100);
        totalPL += pl;
        plValues.set(row, pl);
        plCell.textContent = (pl >= 0 ? '+' : '') + '$' + pl.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        plCell.classList.remove('empty');
        plCell.classList.toggle('pct-pos', pl >= 0);
        plCell.classList.toggle('pct-neg', pl < 0);
        row.dataset[sel.allocKey] = share.toFixed(4);
        row.dataset[sel.plKey] = pl.toFixed(4);
      }
    });

    rows.forEach(row => {
      const shareCell = cellKey === 'yh' ? row._yhShareCell : row._shareCell;
      if (plValues.has(row) && totalPL > 0) {
        const sharePct = (plValues.get(row) / totalPL) * 100;
        shareCell.textContent = sharePct.toFixed(1) + '%';
        shareCell.classList.remove('empty');
        row.dataset[sel.shareKey] = sharePct.toFixed(4);
      } else {
        shareCell.textContent = '–';
        shareCell.classList.add('empty');
        row.dataset[sel.shareKey] = '';
      }
    });

    return { positiveOnly, amount, sumPct, totalPL, eligibleCount };
  }

  // updateAllocation does up to 3 full passes over all 6,761 rows (with
  // per-row querySelector calls), so it must be debounced the same way as
  // applyFilters - otherwise typing in the allocation box floods the main
  // thread just like the range sliders did.
  let updateAllocationTimer = null;
  function updateAllocation() {
    if (updateAllocationTimer) clearTimeout(updateAllocationTimer);
    updateAllocationTimer = setTimeout(updateAllocationImmediate, 120);
  }
  function updateAllocationImmediate() {
    const etResult = computeAllocationForSource('tr', {
      alloc: '.alloc-cell', pl: '.pl-cell', share: '.pl-share-cell',
      allocKey: 'allocShare', plKey: 'allocPl', shareKey: 'allocPlShare',
    });
    const yhResult = computeAllocationForSource('yh', {
      alloc: '.yh-alloc', pl: '.yh-pl', share: '.yh-plshare',
      allocKey: 'yhAllocShare', plKey: 'yhAllocPl', shareKey: 'yhAllocPlShare',
    });

    allocationBox.style.display = etResult.positiveOnly ? 'flex' : 'none';
    const active = currentSource === 'yh' ? yhResult : etResult;
    if (active.positiveOnly && !isNaN(active.amount) && active.amount > 0 && active.sumPct > 0) {
      const returnPct = (active.totalPL / active.amount) * 100;
      // Silently recomputes on every filter change, so the same dollar
      // amount can mean a totally different universe of stocks from one
      // moment to the next with no visible basis - state how many stocks
      // and the actual weighting (proportional to each stock's upside %,
      // not equal-weighted - see the `share = (p / sumPct) * amount` line
      // in computeAllocationForSource above).
      allocationSummary.textContent = `Expected profit (${currentSource === 'yh' ? 'Yahoo Finance' : 'eToro / TipRanks'}): +$${active.totalPL.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })} (+${returnPct.toFixed(1)}%) — across ${active.eligibleCount.toLocaleString()} filtered stock${active.eligibleCount === 1 ? '' : 's'}, weighted by upside %`;
    } else {
      allocationSummary.textContent = '';
    }
  }

  allocationAmount.addEventListener('input', updateAllocation);

  statusFilters.addEventListener('click', (e) => {
    const btn = e.target.closest('.status-pill');
    if (!btn) return;
    const status = btn.dataset.status;
    if (activeStatuses.has(status)) {
      activeStatuses.delete(status);
      btn.classList.remove('active');
    } else {
      activeStatuses.add(status);
      btn.classList.add('active');
    }
    applyFilters();
  });

  const exchanges = [...new Set(rows.map(r => r.dataset.exchange))].sort();
  function renderExchangePills() {
    const pills = ['all', ...exchanges];
    exchangeFilters.innerHTML = pills.map(ex => {
      const label = ex === 'all' ? 'All Exchanges' : ex;
      const activeCls = ex === activeExchange ? ' active' : '';
      return `<button type="button" class="exchange-pill${activeCls}" data-exchange="${ex}">${label}</button>`;
    }).join('');
  }
  renderExchangePills();

  exchangeFilters.addEventListener('click', (e) => {
    const btn = e.target.closest('.exchange-pill');
    if (!btn) return;
    activeExchange = btn.dataset.exchange;
    renderExchangePills();
    applyFilters();
  });

  let pctBasis = 'avg';
  let currentSource = 'tr';
  function srcValFor(row, field, source) {
    return source === 'yh' ? row.dataset['yh' + cap(field)] : row.dataset[field];
  }
  function srcVal(row, field) {
    return srcValFor(row, field, currentSource);
  }
  function computePctFor(row, source) {
    const price = parseFloat(row.dataset.price);
    const target = parseFloat(srcValFor(row, pctBasis, source));
    if (isNaN(price) || isNaN(target) || price <= 0) return null;
    return (target - price) / price * 100;
  }
  function computePct(row) {
    return computePctFor(row, currentSource);
  }

  // dataset.pct (toggle-driven) is used only internally, to decide which source's
  // sign classifies a row for the Upside filter pills / range slider / allocation box.
  function updatePctColumn() {
    rows.forEach(row => {
      const pct = computePct(row);
      row.dataset.pct = pct === null ? '' : pct.toFixed(4);
    });
  }

  // The two visible Upside % columns (eToro's own, Yahoo's own) always show their own
  // source's number, regardless of the Analysis Source toggle.
  function updateComputedPctColumns() {
    rows.forEach(row => {
      const etPct = computePctFor(row, 'tr');
      const etCell = row.querySelector('.pct-cell');
      if (etPct === null) {
        etCell.textContent = '–'; etCell.classList.add('empty'); etCell.classList.remove('pct-pos', 'pct-neg');
        row.dataset.etPct = '';
      } else {
        etCell.textContent = (etPct >= 0 ? '+' : '') + etPct.toFixed(1) + '%';
        etCell.classList.remove('empty');
        etCell.classList.toggle('pct-pos', etPct >= 0);
        etCell.classList.toggle('pct-neg', etPct < 0);
        row.dataset.etPct = etPct.toFixed(4);
      }

      const yhPct = computePctFor(row, 'yh');
      const yhCell = row.querySelector('.yh-pct');
      if (yhPct === null) {
        yhCell.textContent = '–'; yhCell.classList.add('empty'); yhCell.classList.remove('pct-pos', 'pct-neg');
        row.dataset.yhPct = '';
      } else {
        yhCell.textContent = (yhPct >= 0 ? '+' : '') + yhPct.toFixed(1) + '%';
        yhCell.classList.remove('empty');
        yhCell.classList.toggle('pct-pos', yhPct >= 0);
        yhCell.classList.toggle('pct-neg', yhPct < 0);
        row.dataset.yhPct = yhPct.toFixed(4);
      }

      // TP/Yahoo upside ratio: how closely the two sources agree, normalized to
      // 1.0 (perfect agreement) down toward 0 (large disagreement or opposite signs).
      const ratioCell = row.querySelector('.ratio-cell');
      if (ratioCell) {
        if (etPct === null || yhPct === null) {
          ratioCell.textContent = '–'; ratioCell.classList.add('empty'); ratioCell.classList.remove('pct-pos', 'pct-neg');
          row.dataset.upsideRatio = '';
        } else {
          const absEt = Math.abs(etPct), absYh = Math.abs(yhPct);
          let ratio;
          if ((etPct < 0) !== (yhPct < 0) && etPct !== 0 && yhPct !== 0) {
            ratio = 0; // opposite signs = full disagreement
          } else if (absEt === 0 && absYh === 0) {
            ratio = 1;
          } else {
            ratio = Math.min(absEt, absYh) / Math.max(absEt, absYh);
          }
          ratioCell.textContent = ratio.toFixed(2);
          ratioCell.classList.remove('empty');

        const val = row.dataset['yh' + cap(field)];

  function updateInsiderColumn() {
    rows.forEach(row => {
      const cell = row.querySelector('.ins-cell');

      const net = row.dataset.insNet;
      if (net === undefined || net === '') {
        cell.textContent = '–';
        cell.classList.add('empty');
        cell.classList.remove('pct-pos', 'pct-neg');
        return;
      }
      const n = parseFloat(net);
      const buyCount = row.dataset.insBuycount || '0';
      const sellCount = row.dataset.insSellcount || '0';
      const abs = Math.abs(n);
      const fmt = abs >= 1e6 ? (n/1e6).toFixed(1) + 'M' : abs >= 1e3 ? (n/1e3).toFixed(0) + 'K' : n.toFixed(0);
      cell.textContent = (n >= 0 ? '+$' : '-$') + fmt.replace('-', '') + ` (${buyCount}B/${sellCount}S)`;

  function computeUpsideDynamicRange() {
    let min = 0, max = 0;
    rows.forEach(row => {
      const p = parseFloat(row.dataset.pct);
      if (isNaN(p)) return;
      if (p < min) min = p;
      if (p > max) max = p;
    });
    return { min: Math.floor(min), max: Math.ceil(max) };
  }

  function updateUpsideRangeFillBar() {
    const span = (upsideRangeDynamicMax - upsideRangeDynamicMin) || 1;
    const minV = +upsideRangeMinSlider.value;
    const maxV = +upsideRangeMaxSlider.value;
    const leftPct = Math.max(0, Math.min(100, ((minV - upsideRangeDynamicMin) / span) * 100));
    const rightPct = Math.max(0, Math.min(100, ((maxV - upsideRangeDynamicMin) / span) * 100));
    upsideRangeFill.style.left = leftPct + '%';
    upsideRangeFill.style.width = Math.max(0, rightPct - leftPct) + '%';
  }

    const min = minInput.value === '' ? defaultMin : parseFloat(minInput.value);
    const max = maxInput.value === '' ? defaultMax : parseFloat(maxInput.value);
    return Math.abs(min - defaultMin) > 1e-9 || Math.abs(max - defaultMax) > 1e-9;

  function getRowSearchText(row) {
    // row.textContent walks every cell/span in the row and rebuilds a string
    // from scratch - expensive across 6,761 rows, and applyFilters() calls
    // this for EVERY row on EVERY filter interaction (checkbox, slider,
    // typing), not just when the search box has text. Cached once per row
    // element (never invalidated - the row's own content never changes
    // client-side after page load, only its display/order do).
    if (row._searchText === undefined) {
      row._searchText = row.textContent.toLowerCase();
    }
    return row._searchText;
  }

  // Debounced wrapper - the real work is applyFiltersImmediate below. 24
  // range sliders (see the *RangeMin/Max Slider 'input' listeners) each
  // call applyFilters() on every 'input' event, which fires continuously
  // while dragging (can be 100+ times/sec) - undebounced, each of those
  // ran a full pass over all 6,761 rows with ~14 checks per row, which is
  // exactly what froze the tab into a "Page Unresponsive" dialog during a
  // slider drag (2026-09-10). Debouncing means rapid-fire calls just keep
  // resetting this timer - the expensive pass only actually runs once,
  // ~120ms after the user stops moving the slider/typing/etc. No call site
  // relies on applyFilters() having already run by the time it returns
  // (every one of the 50+ callers is the last statement in its handler),
  // so this is safe everywhere it's already called.
  let applyFiltersTimer = null;
  function applyFilters() {
    // The actual filter pass over 6,761 rows can take over a second with no
    // other visual feedback, which reads as "did my click even register?" -
    // dim the table the instant a filter change is queued, not just once
    // the (still-debounced) work actually starts.
    if (stockTable) stockTable.classList.add('filtering');
    if (applyFiltersTimer) clearTimeout(applyFiltersTimer);
    applyFiltersTimer = setTimeout(applyFiltersImmediate, 120);
  }

  function applyFiltersImmediate() {
    updateFilterGroupDots();
    const q = search.value.trim().toLowerCase();
    const min = parseFloat(priceMin.value);
    const max = parseFloat(priceMax.value);
    let shown = 0;
    rows.forEach(row => {
      const text = getRowSearchText(row);
      const price = parseFloat(row.dataset.price);
      let match = text.includes(q);
      if (match && activeExchange !== 'all') match = row.dataset.exchange === activeExchange;
      if (match && !isNaN(min)) match = price >= min;
      if (match && !isNaN(max)) match = price <= max;
      if (match) match = activeStatuses.has(rowStatus(row));
      if (match) match = activeUpside.has(rowUpside(row));
      if (match) match = upsideInRange(row);
      if (match) match = ratioInRange(row);
      if (match) match = scoreInRange(row);
      if (match) match = confidenceInRange(row);
      if (match) match = secScoreInRange(row);
      if (match) match = secConfidenceInRange(row);
      if (match) match = riskScoreInRange(row);
      if (match) match = riskConfidenceInRange(row);
      if (match) match = growthScoreInRange(row);
      if (match) match = growthConfidenceInRange(row);
      if (match) match = overallScoreInRange(row);
      if (match) match = overallConfidenceInRange(row);
      if (match) match = matchesPortfolio(row);
      row.style.display = match ? '' : 'none';
      if (match) shown++;
    });
    noResults.style.display = shown === 0 ? 'block' : 'none';
    count.textContent = `Showing ${shown.toLocaleString()} of ${total.toLocaleString()}`;
    renumberRows();
    updateAllocation();
    updateActiveFiltersStrip();
    stockTable.classList.remove('filtering');
  }

  // With 7+ simultaneous pill filters plus 7 collapsible range-slider
  // groups, there was no single place to see "what am I currently looking
  // at" - each filter's own highlighted state is scattered across the page.
  // This renders a compact read-only summary strip below the search box.
  function updateActiveFiltersStrip() {
    const strip = document.getElementById('activeFiltersStrip');
    if (!strip) return;
    const chips = [];
    statusFilters.querySelectorAll('.status-pill.active').forEach(b => chips.push(b.textContent.trim()));
    upsideFilters.querySelectorAll('.status-pill.active').forEach(b => chips.push(b.textContent.trim()));
    if (portfolioMode !== 'all') {
      const btn = portfolioFilters.querySelector('.status-pill.active');
      if (btn) chips.push(btn.textContent.trim());
    }
    if (activeExchange !== 'all') chips.push(activeExchange);
    const srcBtn = sourceToggle.querySelector('.acct-btn.active');
    if (srcBtn) chips.push(srcBtn.textContent.trim());
    const acctBtn = accountToggle.querySelector('.acct-btn.active');
    if (acctBtn) chips.push(acctBtn.textContent.trim());
    if (search.value.trim()) chips.push(`Search: "${search.value.trim()}"`);
    if (priceMin.value || priceMax.value) {
      chips.push(`Price: ${priceMin.value || '0'}–${priceMax.value || '∞'}`);
    }
    document.querySelectorAll('.filter-group.filter-active').forEach(g => {
      const summary = g.querySelector('summary');
      if (summary) chips.push(summary.textContent.trim() + ' (custom range)');
    });
    strip.innerHTML = chips.map(c => `<span class="af-chip">${c}</span>`).join('');
  }

  const numericKeys = [
    'price', 'cons', 'div', 'low', 'avg', 'high', 'yhLow', 'yhAvg', 'yhHigh', 'yhDiv',

  function applySort() {
    rows.sort((a, b) => {
      let cmp;
      if (sortKey in myPortfolioKeys) {
        const field = myPortfolioKeys[sortKey];
        const av = parseFloat(pf(a, currentAccount, field));
        const bv = parseFloat(pf(b, currentAccount, field));
        const aNa = isNaN(av), bNa = isNaN(bv);
        if (aNa && bNa) cmp = 0;
        else if (aNa) return 1;
        else if (bNa) return -1;
        else cmp = av - bv;
      } else if (numericKeys.includes(sortKey)) {
        const av = parseFloat(a.dataset[sortKey]);
        const bv = parseFloat(b.dataset[sortKey]);
        const aNa = isNaN(av), bNa = isNaN(bv);
        if (aNa && bNa) cmp = 0;
        else if (aNa) return 1;
        else if (bNa) return -1;
        else cmp = av - bv;
      } else if (sortKey === 'exchange') {
        cmp = a.dataset.exchange.localeCompare(b.dataset.exchange) || a.dataset.ticker.localeCompare(b.dataset.ticker);
      } else if (sortKey === 'rating') {
        cmp = a.dataset.rating.localeCompare(b.dataset.rating) || a.dataset.ticker.localeCompare(b.dataset.ticker);
      } else {
        cmp = a.dataset.ticker.localeCompare(b.dataset.ticker);
      }
      return sortDir === 'asc' ? cmp : -cmp;
    });
    // Batch the reorder into one reflow instead of up to 6,761 (appendChild
    // on an already-attached node just moves it, but doing that one row at a
    // time in the live document can force the browser to recompute layout
    // repeatedly - collecting into an off-document fragment first and
    // appending once gives the identical final order with a single reflow).
    const frag = document.createDocumentFragment();
    rows.forEach(row => frag.appendChild(row));
    tbody.appendChild(frag);
    renumberRows();
  }

  let sortMenuEl = null;
  function ensureSortMenu() {
    if (sortMenuEl) return sortMenuEl;

        sortMenuEl.classList.remove('open');
      }
    });
    window.addEventListener('scroll', () => sortMenuEl.classList.remove('open'), { capture: true, passive: true });
    return sortMenuEl;
  }

  function openSortMenu(key, th) {
    const menu = ensureSortMenu();
    const numeric = isNumericSortKey(key);
    const opts = numeric
      ? [['asc', 'Min → Max'], ['desc', 'Max → Min']]
      : [['asc', 'A → Z'], ['desc', 'Z → A']];
    menu.innerHTML = opts.map(([dir, label]) =>
      `<button type="button" class="sort-menu-item${sortKey === key && sortDir === dir ? ' active' : ''}" data-dir="${dir}">${label}</button>`
    ).join('');
    menu.querySelectorAll('.sort-menu-item').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        setSort(key, btn.dataset.dir);
        menu.classList.remove('open');
      });
    });
    const rect = th.getBoundingClientRect();
    menu.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 180)) + 'px';
    menu.style.top = (rect.bottom + 4) + 'px';
    menu.classList.add('open');
  }

  if (colToggleNoneBtn) colToggleNoneBtn.addEventListener('click', (e) => {

  attachHeaderSort(sortName, 'name');
  attachHeaderSort(sortExchange, 'exchange');

  attachHeaderSort(sortCons, 'cons');
  attachHeaderSort(sortRating, 'rating');

  attachHeaderSort(sortHigh, 'high');
  attachHeaderSort(sortPct, 'etPct');
  attachHeaderSort(sortUpsideRatio, 'upsideRatio');
  attachHeaderSort(sortInsider, 'insNet');
  attachHeaderSort(sortShort, 'short');
  attachHeaderSort(sortRsi, 'rsi');
  attachHeaderSort(sortPe, 'pe');
  attachHeaderSort(sortMcap, 'mcap');
  attachHeaderSort(sortHf, 'hfNet');
  attachHeaderSort(sortBeta, 'beta');
  attachHeaderSort(sortVol, 'vol');
  attachHeaderSort(sortPeg, 'peg');
  attachHeaderSort(sortR52, 'r52');
  attachHeaderSort(sortSecScore, 'secscore');
  attachHeaderSort(sortRiskScore, 'riskscore');
  attachHeaderSort(sortOverallScore, 'overallscore');
  attachHeaderSort(sortPercentile, 'percentile');
  attachHeaderSort(sortRoe, 'roe');
  attachHeaderSort(sortInstOwn, 'instown');
  attachHeaderSort(sortCurrentRatio, 'currentratio');
  attachHeaderSort(sortQuickRatio, 'quickratio');
  attachHeaderSort(sortRoa, 'roa');
  attachHeaderSort(sortHeldInsiders, 'heldinsiders');
  attachHeaderSort(sortGrossMargin, 'grossmargin');
  attachHeaderSort(sortOpMargin, 'opmargin');
  attachHeaderSort(sortFcfYield, 'fcfyield');
  attachHeaderSort(sortCoverage, 'coverage');
  attachHeaderSort(sortFwdPe, 'fwdpe');

  attachHeaderSort(sortPb, 'pb');
  attachHeaderSort(sortEvEbitda, 'evebitda');
  attachHeaderSort(sortEvRevenue, 'evrevenue');
  attachHeaderSort(sortPayout, 'payout');
  attachHeaderSort(sortEbitdaMargin, 'ebitdamargin');
  attachHeaderSort(sortCashMcap, 'cashmcap');
  attachHeaderSort(sortOcfMargin, 'ocfmargin');
  attachHeaderSort(sortShortIntTrend, 'shortinttrend');
  attachHeaderSort(sortFloatPct, 'floatpct');
  attachHeaderSort(sortEpsGrowth5y, 'epsgrowth5y');
  attachHeaderSort(sortEpsGrowthNextYear, 'epsgrowthnextyear');

  let searchDebounceTimer = null;
  search.addEventListener('input', () => {
    clearTimeout(searchDebounceTimer);
    searchDebounceTimer = setTimeout(applyFilters, 150);
  });
  priceMin.addEventListener('input', applyFilters);
  priceMax.addEventListener('input', applyFilters);

  updateYahooColumns();
  updateInsiderColumn();
  applyCurrencyLabels();
  updateSourceHighlight();
  updateComputedPctColumns();
  updatePctColumn();
  resetUpsideRangeToFull();
  // Default to highest-upside-first (eToro/TipRanks Upside %) instead of
  // alphabetical by ticker - upside is what most people actually want to
  // scan first, and it was previously only reachable by clicking the
  // column header's sort menu every single visit.
  setSort('etPct', 'desc');
  applyFilters();

  // Mirror scrollbar above the table (see .table-scroll-top CSS comment) -
  // its inner div is stretched to match the table's real scrollable width,
  // and scrolling either bar drives the other.
  const tableWrapEl = document.querySelector('.table-wrap');
  const tableScrollTop = document.getElementById('tableScrollTop');
  const tableScrollTopInner = document.getElementById('tableScrollTopInner');
  if (tableWrapEl && tableScrollTop && tableScrollTopInner) {
    let syncingScroll = false;
    function syncMirrorWidth() {
      tableScrollTopInner.style.width = stockTable.scrollWidth + 'px';
    }
    tableScrollTop.addEventListener('scroll', () => {
      if (syncingScroll) return;
      syncingScroll = true;
      tableWrapEl.scrollLeft = tableScrollTop.scrollLeft;
      syncingScroll = false;
    }, { passive: true });
    tableWrapEl.addEventListener('scroll', () => {
      if (syncingScroll) return;
      syncingScroll = true;
      tableScrollTop.scrollLeft = tableWrapEl.scrollLeft;
      syncingScroll = false;
    }, { passive: true });
    syncMirrorWidth();
    new ResizeObserver(syncMirrorWidth).observe(stockTable);
    window.addEventListener('resize', syncMirrorWidth);
  }

  // Info-tip bubbles used to be positioned with plain CSS (position:absolute,
  // right:0) relative to their icon. That works fine for a header floating
  // freely on the page, but inside .table-wrap (overflow-x:auto, which per
  // the CSS spec forces overflow-y to compute as auto too) any bubble that
  // would visually extend past table-wrap's own box gets clipped by IT, not
  // just by the viewport - patching individual headers with an "open-right"
  // class was fixing viewport-edge cases one at a time but never this one,
  // since table-wrap's box can be narrower than the viewport regardless of
  // scroll position. Fix: position every bubble with JS as position:fixed,
  // computed fresh relative to the viewport each time it's about to show -
  // this escapes every ancestor's overflow/clipping entirely, for any icon
  // anywhere on the page, without needing a class per header.
  function positionInfoTipBubble(tip) {
    const bubble = tip.querySelector('.info-tip-bubble');
    if (!bubble) return;
    const margin = 8;
    bubble.style.position = 'fixed';
    bubble.style.top = '-9999px';
    bubble.style.left = '0px';
    bubble.style.right = 'auto';
    bubble.style.display = 'block';
    const iconRect = tip.getBoundingClientRect();
    const bubbleRect = bubble.getBoundingClientRect();
    let left = iconRect.right - bubbleRect.width;
    if (left < margin) left = margin;
    if (left + bubbleRect.width > window.innerWidth - margin) {
      left = window.innerWidth - margin - bubbleRect.width;
    }
    let top = iconRect.bottom + 6;
    if (top + bubbleRect.height > window.innerHeight - margin) {
      top = iconRect.top - bubbleRect.height - 6;
      if (top < margin) top = margin;
    }
    bubble.style.left = left + 'px';
    bubble.style.top = top + 'px';
    bubble.style.display = '';
  }

  document.addEventListener('mouseover', (e) => {
    const tip = e.target.closest && e.target.closest('.info-tip');
    if (tip) positionInfoTipBubble(tip);
  });
  document.addEventListener('focusin', (e) => {
    const tip = e.target.closest && e.target.closest('.info-tip');
    if (tip) positionInfoTipBubble(tip);
  });

  // Shared, memoized fetch of scan_checkpoint.json - initLastRunTimestamps
  // and initReentryPanel both need it and used to each issue their own
  // independent request on every page load; this caches the one in-flight
  // promise so the file is only fetched once.
  let scanCheckpointPromise = null;
  function fetchScanCheckpoint() {
    if (!scanCheckpointPromise) {
      scanCheckpointPromise = fetch(`scan_checkpoint.json?t=${Date.now()}`)
        .then(res => res.ok ? res.json() : Promise.reject(new Error('not found')));
    }
    return scanCheckpointPromise;
  }

  // "Last performed" timestamps for the three scans that require a live
  // Claude session (SCAN RED / SCAN HOLDINGS / SCAN EXITS) - they have no
  // Run button (nothing here can drive that live browser session), so this
  // is the only way the site shows when they last actually happened. Reads
  // the last-modified time of whatever file each scan is known to touch,
  // via a HEAD request (the local static file server sends a real
  // Last-Modified header for that regardless of file type). All three
  // files are local-only/gitignored except SCAN_RED_LOG.md, so on the
  // public GitHub Pages site the HEAD requests for the other two just 404
  // and those two lines silently stay blank - same treatment as every
  // other local-only signal on this page.
  (function initLastRunTimestamps() {
    function fmtAgoLocal(unixSec) {
      const s = Date.now() / 1000 - unixSec;
      if (s < 60) return 'הרגע';
      if (s < 3600) return Math.round(s / 60) + ' דק׳';
      if (s < 86400) return Math.round(s / 3600) + ' שע׳';
      return Math.round(s / 86400) + ' ימים';
    }

    function showLastRun(elId, unixSec) {
      const el = document.getElementById(elId);
      if (!el) return;
      const d = new Date(unixSec * 1000);
      const dateStr = d.toLocaleDateString('he-IL') + ' ' + d.toLocaleTimeString('he-IL', { hour: '2-digit', minute: '2-digit' });
      el.textContent = `בוצע לאחרונה: ${dateStr} (לפני ${fmtAgoLocal(unixSec)})`;
      el.title = d.toString();
    }

    function fetchLastModified(...files) {
      // Takes the MOST RECENT Last-Modified across all given files (e.g.
      // SCAN HOLDINGS touches both portfolio_real.tsv and
      // portfolio_virtual.tsv - whichever was updated more recently is
      // the meaningful "last ran" answer).
      return Promise.all(files.map(f =>
        fetch(`${f}?t=${Date.now()}`, { method: 'HEAD' })
          .then(res => {
            if (!res.ok) return null;
            const lm = res.headers.get('Last-Modified');
            return lm ? new Date(lm).getTime() / 1000 : null;
          })
          .catch(() => null)
      )).then(times => {
        const valid = times.filter(t => t !== null);
        return valid.length ? Math.max(...valid) : null;
      });
    }

    fetchLastModified('SCAN_RED_LOG.md').then(t => t && showLastRun('lastRunScanRed', t));
    fetchLastModified('portfolio_real.tsv', 'portfolio_virtual.tsv').then(t => t && showLastRun('lastRunScanHoldings', t));

    fetchScanCheckpoint()
      .then(cp => {
        const dates = ['real', 'virtual'].map(acc => cp[acc] && cp[acc].last_scanned_on).filter(Boolean);
        if (!dates.length) return;
        const el = document.getElementById('lastRunScanExits');
        if (el) el.textContent = `בוצע לאחרונה: ${dates.sort().reverse()[0]}`;
      })
      .catch(() => {});
  })();

  // Re-entry Watchlist panel - reads REENTRY_WATCHLIST.md (a plain
  // Markdown table written by check_reentry_opportunities.py). That file
  // is gitignored and only ever exists on the machine running
  // portfolio_server.py - on the public GitHub Pages site the fetch
  // below just 404s and the panel stays hidden, exactly as it should
  // (this data reveals real trading activity, same as portfolio_real.tsv).
  (function initReentryPanel() {
    const panel = document.getElementById('reentryPanel');
    const countEl = document.getElementById('reentryCount');
    const groupsEl = document.getElementById('reentryGroups');
    const checkpointEl = document.getElementById('reentryCheckpoint');
    const toggleAllBtn = document.getElementById('reentryToggleAll');
    if (!panel) return;

    // Shared across both Real/Virtual groups (renderGroup is called once per
    // group) so the sort-menu element and its document/window listeners get
    // created once, not duplicated per group.
    let reentrySortMenuEl = null;
    function ensureReentrySortMenu() {
      if (reentrySortMenuEl) return reentrySortMenuEl;
      reentrySortMenuEl = document.createElement('div');
      reentrySortMenuEl.className = 'sort-menu';
      document.body.appendChild(reentrySortMenuEl);
      document.addEventListener('click', (e) => {
        if (!reentrySortMenuEl.contains(e.target) && !e.target.closest('.reentry-sort-trigger')) {
          reentrySortMenuEl.classList.remove('open');
        }
      });
      window.addEventListener('scroll', () => reentrySortMenuEl.classList.remove('open'), { capture: true, passive: true });
      return reentrySortMenuEl;
    }

    // Scan checkpoint - written by update_exit_history.py every time a new
    // batch of exit history is merged in. Shows how far each account
    // (real/virtual) has been scanned so far and when, so it's obvious at a
    // glance whether the watchlist above is stale. Same local-only/gitignored
    // treatment as REENTRY_WATCHLIST.md itself - 404s harmlessly on the
    // public site.
    if (checkpointEl) {
      fetchScanCheckpoint()
        .then(cp => {
          const parts = ['real', 'virtual']
            .filter(acc => cp[acc] && cp[acc].last_exit_date)
            .map(acc => `${acc}: עד ${cp[acc].last_exit_date} (נסרק ${cp[acc].last_scanned_on})`);
          if (!parts.length) return;
          checkpointEl.textContent = `נסרק במלואו ${parts.join(' · ')}`;
          checkpointEl.style.display = '';
        })
        .catch(() => {
          // scan_checkpoint.json doesn't exist yet - stays hidden.
        });
    }

    // Splits the file into its "## Real (N)" / "## Virtual (N)" sections
    // (check_reentry_opportunities.py always writes both, in that order,
    // each followed by either a table or a "_No candidates._" line) so the
    // two accounts render as visually separate groups instead of one mixed
    // table - seeing a Real-account row and a Virtual-account row back to
    // back read as one combined list, which isn't what they are.
    function parseSections(text) {
      const lines = text.split('\n');
      const sections = [];
      let current = null;
      for (const line of lines) {
        const headingMatch = line.match(/^##\s+(.+?)\s*\((\d+)\)\s*$/);
        if (headingMatch) {
          current = { title: headingMatch[1], count: parseInt(headingMatch[2], 10), headers: [], rows: [] };
          sections.push(current);
          continue;
        }
        if (!current) continue;
        const trimmed = line.trim();
        if (!trimmed.startsWith('|')) continue;
        const cells = trimmed.replace(/^\||\|$/g, '').split('|').map(c => c.trim());
        if (cells.every(c => /^-+$/.test(c))) continue; // markdown separator row
        if (!current.headers.length) current.headers = cells;
        else current.rows.push(cells);
      }
      return sections;
    }

    function pctClass(str) {
      const v = parseFloat(str);
      if (isNaN(v)) return '';
      return v >= 0 ? 'grade-vgood' : 'grade-vbad';
    }

    // Collapsed by default - a re-entry candidate list per account is
    // useful to check on demand, not something that needs to stay open and
    // take up space every time the page loads. Each group (Real/Virtual)
    // toggles independently by clicking its own title; the header button
    // toggles all of them together in one click.
    function renderGroup(section) {
      const wrap = document.createElement('div');
      wrap.className = 'reentry-group collapsed';
      const title = document.createElement('div');
      title.className = 'reentry-group-title';
      title.innerHTML = `<span class="reentry-group-arrow">&#9660;</span><span>${section.title} (${section.count})</span>`;
      title.addEventListener('click', () => {
        wrap.classList.toggle('collapsed');
        syncToggleAllLabel();
      });
      wrap.appendChild(title);

      if (!section.rows.length) {
        const empty = document.createElement('div');
        empty.className = 'reentry-group-empty';
        empty.textContent = 'אין מועמדים כרגע.';
        wrap.appendChild(empty);
        return wrap;
      }

      const table = document.createElement('table');
      table.className = 'reentry-table';
      const thead = document.createElement('thead');
      const headRow = document.createElement('tr');
      const tbody = document.createElement('tbody');

      function renderRows(rows) {
        tbody.innerHTML = rows.map(row => {
          const cells = row.map((cell, i) => {
            const header = section.headers[i] || '';
            // Ticker column - link out to the same eToro research page the
            // main table's ticker cells use, opening in a new tab, so a
            // watchlist candidate doesn't require re-searching for it
            // manually in the main table.
            if (header === 'Ticker') {
              const url = `https://www.etoro.com/markets/${cell.toLowerCase()}/research`;
              return `<td><a class="stock-link" href="${url}" target="_blank" rel="noopener">${cell}</a></td>`;
            }
            const cls = /%/.test(cell) || /upside|down/i.test(header) ? pctClass(cell) : '';
            return `<td class="${cls}">${cell}</td>`;
          }).join('');
          return `<tr>${cells}</tr>`;
        }).join('');
      }

      // Click-to-sort with the same dropdown-menu UX as the main table's
      // sortable columns (Min/Max, A/Z, Oldest/Newest) - self-contained
      // rather than reusing the main table's sort-menu code directly since
      // this table is small (a handful of columns, up to a few dozen rows)
      // and lives in a separate scope, but it reuses the exact same
      // .sort-menu/.sort-menu-item CSS classes so it looks identical.
      // Column type is auto-detected: every cell parses as a number once
      // $/%/+/,/spaces are stripped -> numeric (Exit $, Now $, Target $,
      // the two percentage columns); every cell matches YYYY-MM-DD -> date
      // (Exit date); anything else (Ticker, Account) -> plain text.
      let sortCol = null;
      let sortDir = 'desc';
      const rowsData = section.rows;
      const DATE_RE = /^\d{4}-\d{2}-\d{2}$/;

      function numOf(cell) {
        const n = parseFloat(String(cell).replace(/[$%,+\s]/g, ''));
        return isNaN(n) ? null : n;
      }

      function colType(colIdx) {
        if (rowsData.every(r => DATE_RE.test(String(r[colIdx]).trim()))) return 'date';
        if (rowsData.every(r => numOf(r[colIdx]) !== null)) return 'numeric';
        return 'text';
      }

      function applySort(colIdx, dir) {
        sortCol = colIdx;
        sortDir = dir;
        const type = colType(colIdx);
        const sorted = rowsData.slice().sort((a, b) => {
          let cmp;
          if (type === 'numeric') {
            cmp = numOf(a[colIdx]) - numOf(b[colIdx]);
          } else {
            // Dates (YYYY-MM-DD) sort correctly with plain string compare too.
            cmp = String(a[colIdx]).localeCompare(String(b[colIdx]));
          }
          return sortDir === 'asc' ? cmp : -cmp;
        });
        renderRows(sorted);
        headRow.querySelectorAll('th').forEach((th, i) => {
          const arrow = th.querySelector('.reentry-sort-arrow');
          arrow.innerHTML = i === sortCol ? (sortDir === 'asc' ? '&#9650;' : '&#9660;') : '';
        });
      }

      function openSortMenu(colIdx, th) {
        const menu = ensureReentrySortMenu();
        const type = colType(colIdx);
        const opts = type === 'numeric' ? [['asc', 'Min → Max'], ['desc', 'Max → Min']]
          : type === 'date' ? [['asc', 'Oldest → Newest'], ['desc', 'Newest → Oldest']]
          : [['asc', 'A → Z'], ['desc', 'Z → A']];
        menu.innerHTML = opts.map(([dir, label]) =>
          `<button type="button" class="sort-menu-item${sortCol === colIdx && sortDir === dir ? ' active' : ''}" data-dir="${dir}">${label}</button>`
        ).join('');
        menu.querySelectorAll('.sort-menu-item').forEach(btn => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            applySort(colIdx, btn.dataset.dir);
            menu.classList.remove('open');
          });
        });
        const rect = th.getBoundingClientRect();
        menu.style.left = Math.max(4, Math.min(rect.left, window.innerWidth - 180)) + 'px';
        menu.style.top = (rect.bottom + 4) + 'px';
        menu.classList.add('open');
      }

      headRow.innerHTML = section.headers.map((h, i) =>
        `<th class="reentry-sort-trigger" data-col="${i}" tabindex="0" role="button" aria-haspopup="true">${h}<span class="reentry-sort-arrow"></span></th>`
      ).join('');
      headRow.querySelectorAll('th').forEach(th => {
        th.addEventListener('click', () => openSortMenu(parseInt(th.dataset.col, 10), th));
        th.addEventListener('keydown', (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          openSortMenu(parseInt(th.dataset.col, 10), th);
        });
      });

      // Default to newest-exit-first rather than whatever order the Python
      // side happened to write the rows in (sorted by upside %) - the exit
      // date is what most naturally answers "what did I sell recently that
      // might be worth watching," so it should be the default view, not
      // something you have to click a header to get every time.
      const exitDateCol = section.headers.indexOf('Exit date');
      if (exitDateCol !== -1) {
        applySort(exitDateCol, 'desc');
      } else {
        renderRows(rowsData);
      }
      thead.appendChild(headRow);
      table.appendChild(thead);
      table.appendChild(tbody);
      wrap.appendChild(table);
      return wrap;
    }

    function syncToggleAllLabel() {
      if (!toggleAllBtn) return;
      const groups = groupsEl.querySelectorAll('.reentry-group');
      const anyExpanded = Array.from(groups).some(g => !g.classList.contains('collapsed'));
      toggleAllBtn.textContent = anyExpanded ? 'הסתר הכל' : 'הצג הכל';
    }

    fetch(`REENTRY_WATCHLIST.md?t=${Date.now()}`)
      .then(res => res.ok ? res.text() : Promise.reject(new Error('not found')))
      .then(text => {
        const countMatch = text.match(/\*\*(\d+) candidate/);
        const count = countMatch ? parseInt(countMatch[1], 10) : 0;
        if (!count) return; // no candidates today - leave the panel hidden

        const sections = parseSections(text);
        if (!sections.length) return;

        countEl.textContent = `${count} candidate${count === 1 ? '' : 's'}`;
        groupsEl.innerHTML = '';
        sections.forEach(section => groupsEl.appendChild(renderGroup(section)));
        panel.style.display = '';

        if (toggleAllBtn) {
          toggleAllBtn.style.display = '';
          toggleAllBtn.onclick = () => {
            const groups = groupsEl.querySelectorAll('.reentry-group');
            const anyExpanded = Array.from(groups).some(g => !g.classList.contains('collapsed'));
            groups.forEach(g => g.classList.toggle('collapsed', anyExpanded));
            syncToggleAllLabel();
          };
          syncToggleAllLabel();
        }
      })
      .catch(() => {
        // File doesn't exist yet (no exit_history.tsv, or running on the
        // public site) - panel just stays hidden, no error shown.
      });
  })();
</script>
