name: Daily Stock Scan

# Runs the 4 public-data scans (MEGASCAN, MEGASCAN YAHOO, INSIDER SCAN,
# FUNDAMENTALS SCAN) entirely in the cloud, on GitHub's own runner, and
# commits the refreshed data + rebuilt site back to this repo. None of these
# scripts need a login or any personal data - they scrape/query public
# market data (TipRanks/Yahoo Finance/SEC EDGAR) for the full universe of
# 6,761 tickers, same as running them locally.
#
# NOT run here (must stay local, see README): SCAN VALUES (scoped to this
# account's actual holdings - reads portfolio_virtual.tsv/portfolio_real.tsv,
# which are gitignored and never exist on this runner), and SCAN
# HOLDINGS/SCAN RED (need a live authenticated eToro browser session).

on:
  schedule:
    # 21:00 UTC = ~23:00-00:00 Israel time depending on DST - a few hours
    # before the local machine's earliest daily pull (02:00 Israel via the
    # "eToro Daily Scan" Scheduled Task), so pull_and_merge.py finds fresh
    # data waiting rather than yesterday's.
    - cron: "0 21 * * *"
  workflow_dispatch: {}   # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Install headless Chromium for Playwright
        run: playwright install --with-deps chromium

      - name: Run all 4 scans with live progress heartbeat
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Every 30s, copy whichever *_LOG.md was most recently written (the
          # scan currently in progress) into CLOUD_PROGRESS.md and push it -
          # the site polls this raw file directly to show live "Done/Total,
          # ETA" progress for the cloud scan, same format the local scan
          # panel already parses. [skip ci] avoids re-triggering this
          # workflow on its own progress commits.
          (
            while true; do
              sleep 30
              latest=$(ls -t MEGASCAN_LOG.md MEGASCAN_YAHOO_LOG.md INSIDER_SCAN_LOG.md FUNDAMENTALS_SCAN_LOG.md 2>/dev/null | head -1)
              if [ -n "$latest" ]; then
                echo "SOURCE: $latest" > CLOUD_PROGRESS.md
                cat "$latest" >> CLOUD_PROGRESS.md
                git add CLOUD_PROGRESS.md
                git diff --cached --quiet || (git commit -q -m "Cloud scan progress update [skip ci]" && git push -q)
              fi
            done
          ) &
          HEARTBEAT_PID=$!

          python megascan.py
          python megascan_yahoo.py
          python insider_scan.py
          python fundamentals_scan.py

          kill "$HEARTBEAT_PID" 2>/dev/null || true

      - name: Publish site to GitHub Pages entry point
        run: cp nasdaq-stocks.html index.html

      - name: Commit and push refreshed data
        run: |
          git pull --rebase
          echo "Done - see CLOUD_PROGRESS.md history for this run's own log" > CLOUD_PROGRESS.md
          git add -A
          git diff --cached --quiet && echo "No changes to commit" || git commit -m "Automated daily scan update [skip ci]"
          git push
